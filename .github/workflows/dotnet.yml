name: .NET

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  pipeline:
    runs-on: windows-latest
    timeout-minutes: 30

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        working-directory: source
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ github.workspace }}/global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        id: restore
        run: dotnet restore

      - name: Format check
        id: format
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Build
        id: build
        run: dotnet build --no-restore

      - name: Test
        id: test
        continue-on-error: true
        run: >
          dotnet test
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./Tests/TestResults

      - name: Install reportgenerator
        if: always()
        run: |
          dotnet tool update --global dotnet-reportgenerator-globaltool `
          || dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage
        id: coverage
        if: always()
        run: |
          $files = Get-ChildItem ./Tests/TestResults -Recurse -Filter *.cobertura.xml -ErrorAction SilentlyContinue
          if (-not $files) {
            "report=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          reportgenerator `
            -reports:"./Tests/**/TestResults/**/*.cobertura.xml" `
            -targetdir:coverage `
            -reporttypes:"HtmlInline_AzurePipelines;Cobertura;TextSummary"

          if (Test-Path "coverage/Cobertura.xml") {
            "report=true" >> $env:GITHUB_OUTPUT
          } else {
            "report=false" >> $env:GITHUB_OUTPUT
          }

      - name: Changed files
        id: changed
        if: always()
        uses: tj-actions/changed-files@v46
        with:
          files: source/**/*.cs
          files_ignore: source/Tests/**

      - name: Coverage check (changed files)
        id: coverage-check
        if: always()
        run: |
          if ("${{ steps.test.outcome }}" -ne "success") {
            "pct=N/A" >> $env:GITHUB_OUTPUT
            "status=❌ Tests failed" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if (-not (Test-Path "coverage/Cobertura.xml")) {
            "pct=N/A" >> $env:GITHUB_OUTPUT
            "status=❌ No coverage" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $changed = "${{ steps.changed.outputs.all_changed_files }}" -split '\s+' | ? { $_ }

          if (-not $changed) {
            "pct=0" >> $env:GITHUB_OUTPUT
            "status=⏭️ Skipped" >> $env:GITHUB_OUTPUT
            exit 0
          }

          [xml]$xml = Get-Content "coverage/Cobertura.xml"

          $total = 0
          $covered = 0
          $bad = @()

          foreach ($file in $changed) {
            $norm = ($file -replace '\\','/') -replace '^source/',''

            $classes = $xml.coverage.packages.package.classes.class |
              ? { ($_.filename -replace '\\','/') -like "*$norm" }

            foreach ($c in $classes) {
              $lines = @($c.lines.line)
              if (-not $lines) { continue }

              $t = $lines.Count
              $cvr = ($lines | ? { [int]$_.hits -gt 0 }).Count

              $total += $t
              $covered += $cvr

              $pct = [math]::Round(($cvr/$t)*100,1)
              if ($pct -lt 90) {
                $bad += "$norm — $pct% ($cvr/$t)"
              }
            }
          }

          if ($total -eq 0) {
            "pct=0" >> $env:GITHUB_OUTPUT
            "status=⏭️ Skipped" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $pct = [math]::Round(($covered/$total)*100,2)
          "pct=$pct" >> $env:GITHUB_OUTPUT

          if ($pct -lt 90) {
            "status=❌ Failed" >> $env:GITHUB_OUTPUT
            $bad -join "`n" > coverage_failed.txt
          } else {
            "status=✅ Passed" >> $env:GITHUB_OUTPUT
          }

      - name: PR comment
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          message: |
            ## 📊 Coverage

            | Step | Result |
            |------|--------|
            | Restore | ${{ steps.restore.outcome }} |
            | Format | ${{ steps.format.outcome }} |
            | Build | ${{ steps.build.outcome }} |
            | Tests | ${{ steps.test.outcome }} |
            | Coverage | ${{ steps.coverage-check.outputs.pct }}% |
            | Status | ${{ steps.coverage-check.outputs.status }} |

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.coverage.outputs.report == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.workspace }}/source/coverage
          publish_branch: gh-pages
          keep_files: true

      - name: Fail pipeline
        if: always()
        run: |
          if ("${{ steps.restore.outcome }}" -ne "success") { exit 1 }
          if ("${{ steps.format.outcome }}" -ne "success") { exit 1 }
          if ("${{ steps.build.outcome }}" -ne "success") { exit 1 }
          if ("${{ steps.test.outcome }}" -ne "success") { exit 1 }
          if ("${{ steps.coverage-check.outputs.status }}" -eq "❌ Failed") { exit 1 }
