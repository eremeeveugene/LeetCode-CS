name: .NET

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  pipeline:
    runs-on: windows-latest
    timeout-minutes: 30

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        working-directory: source
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ github.workspace }}/global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Restore
        id: restore
        run: dotnet restore

      - name: Format check
        id: format
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Sonar begin
        id: sonar-begin
        if: success() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin
          /k:"eremeeveugene_LeetCode-CS"
          /o:"eremeeveugene"
          /d:sonar.cs.cobertura.reportsPaths="Tests/**/TestResults/**/*.cobertura.xml"
          /d:sonar.exclusions="coverage/**"
          /d:sonar.qualitygate.wait=true

      - name: Build
        id: build
        run: dotnet build --no-restore

      - name: Test
        id: test
        continue-on-error: true
        run: >
          dotnet test
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./Tests/TestResults

      - name: Install reportgenerator
        if: always()
        run: |
          dotnet tool update --global dotnet-reportgenerator-globaltool `
          || dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage
        id: coverage
        if: always()
        run: |
          $files = Get-ChildItem ./Tests/TestResults -Recurse -Filter *.cobertura.xml -ErrorAction SilentlyContinue
          if (-not $files) {
            "report=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          reportgenerator `
            -reports:"./Tests/**/TestResults/**/*.cobertura.xml" `
            -targetdir:coverage `
            -reporttypes:"HtmlInline_AzurePipelines;Cobertura;TextSummary"

          if (Test-Path "coverage/Cobertura.xml") {
            "report=true" >> $env:GITHUB_OUTPUT
          } else {
            "report=false" >> $env:GITHUB_OUTPUT
          }

      - name: Sonar end
        id: sonar-end
        if: always() && steps.build.outcome == 'success' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ${{ runner.temp }}\scanner\dotnet-sonarscanner end

      - name: Check for new issues
        id: new-issues
        if: always() && steps.sonar-end.outcome == 'success'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $scope = if ("${{ github.event_name }}" -eq "pull_request") {
            "pullRequest=${{ github.event.pull_request.number }}"
          } else {
            "branch=develop"
          }

          $uri = "https://sonarcloud.io/api/issues/search?componentKeys=eremeeveugene_LeetCode-CS&resolved=false&inNewCodePeriod=true&$scope"

          $headers = @{ Authorization = "Bearer $env:SONAR_TOKEN" }

          $response = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get

          $count = $response.total

          "count=$count" >> $env:GITHUB_OUTPUT

          if ($count -gt 0) {
            "status=❌ $count new issue(s)" >> $env:GITHUB_OUTPUT
          } else {
            "status=✅ No new issues" >> $env:GITHUB_OUTPUT
          }

      - name: Changed files
        id: changed
        if: always()
        uses: tj-actions/changed-files@v46
        with:
          files: source/**/*.cs
          files_ignore: source/Tests/**

      - name: Coverage check (changed files)
        id: coverage-check
        if: always()
        run: |
          if ("${{ steps.test.outcome }}" -ne "success") {
            "pct=N/A" >> $env:GITHUB_OUTPUT
            "status=❌ Tests failed" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if (-not (Test-Path "coverage/Cobertura.xml")) {
            "pct=N/A" >> $env:GITHUB_OUTPUT
            "status=❌ No coverage" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $changed = "${{ steps.changed.outputs.all_changed_files }}" -split '\s+' | ? { $_ }

          if (-not $changed) {
            "pct=0" >> $env:GITHUB_OUTPUT
            "status=⏭️ Skipped" >> $env:GITHUB_OUTPUT
            exit 0
          }

          [xml]$xml = Get-Content "coverage/Cobertura.xml"

          $total = 0
          $covered = 0
          $bad = @()

          foreach ($file in $changed) {
            $norm = ($file -replace '\\','/') -replace '^source/',''

            $classes = $xml.coverage.packages.package.classes.class |
              ? { ($_.filename -replace '\\','/') -like "*$norm" }

            foreach ($c in $classes) {
              $lines = @($c.lines.line)
              if (-not $lines) { continue }

              $t = $lines.Count
              $cvr = ($lines | ? { [int]$_.hits -gt 0 }).Count

              $total += $t
              $covered += $cvr

              $pct = [math]::Round(($cvr/$t)*100,1)
              if ($pct -lt 90) {
                $bad += "$norm — $pct% ($cvr/$t)"
              }
            }
          }

          if ($total -eq 0) {
            "pct=0" >> $env:GITHUB_OUTPUT
            "status=⏭️ Skipped" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $pct = [math]::Round(($covered/$total)*100,2)
          "pct=$pct" >> $env:GITHUB_OUTPUT

          if ($pct -lt 90) {
            "status=❌ Failed" >> $env:GITHUB_OUTPUT
            $bad -join "`n" > coverage_failed.txt
          } else {
            "status=✅ Passed" >> $env:GITHUB_OUTPUT
          }

      - name: Format results
        id: summary
        if: always()
        env:
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          function Format-Status($outcome, $reason) {
            switch ($outcome) {
              "success"   { "✅ Success" }
              "failure"   { "❌ Failure" }
              "skipped"   { "⏭️ Skipped — $reason" }
              "cancelled" { "⚠️ Cancelled — run cancelled, likely superseded by a newer push" }
              default     { $outcome }
            }
          }

          $sonarSkipReason = if ($env:IS_FORK_PR -eq 'true') { "fork PR — SONAR_TOKEN unavailable" } else { "a previous step failed" }

          "restore=$(Format-Status '${{ steps.restore.outcome }}' 'a previous step failed')" >> $env:GITHUB_OUTPUT
          "format=$(Format-Status '${{ steps.format.outcome }}' 'a previous step failed')" >> $env:GITHUB_OUTPUT
          "build=$(Format-Status '${{ steps.build.outcome }}' 'a previous step failed')" >> $env:GITHUB_OUTPUT
          "test=$(Format-Status '${{ steps.test.outcome }}' 'a previous step failed')" >> $env:GITHUB_OUTPUT
          "sonar=$(Format-Status '${{ steps.sonar-end.outcome }}' $sonarSkipReason)" >> $env:GITHUB_OUTPUT
          "newissues=$(if ('${{ steps.new-issues.outputs.status }}') { '${{ steps.new-issues.outputs.status }}' } else { "⏭️ Skipped — $sonarSkipReason" })" >> $env:GITHUB_OUTPUT

      - name: PR comment
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          message: |
            ## 📊 Coverage

            | Step | Result |
            |------|--------|
            | Restore | ${{ steps.summary.outputs.restore }} |
            | Format | ${{ steps.summary.outputs.format }} |
            | Build | ${{ steps.summary.outputs.build }} |
            | Tests | ${{ steps.summary.outputs.test }} |
            | Coverage | ${{ steps.coverage-check.outputs.pct }}% |
            | Status | ${{ steps.coverage-check.outputs.status }} |
            | Sonar quality gate | ${{ steps.summary.outputs.sonar }} |
            | New issues | ${{ steps.summary.outputs.newissues }} |

            [View on SonarCloud](https://sonarcloud.io/summary/new_code?id=eremeeveugene_LeetCode-CS&pullRequest=${{ github.event.pull_request.number }})

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.coverage.outputs.report == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.workspace }}/source/coverage
          publish_branch: gh-pages
          keep_files: true

      - name: Fail pipeline
        if: always()
        run: |
          if ("${{ steps.restore.outcome }}" -ne "success") { exit 1 }
          if ("${{ steps.format.outcome }}" -ne "success") { exit 1 }
          if ("${{ steps.build.outcome }}" -ne "success") { exit 1 }
          if ("${{ steps.test.outcome }}" -ne "success") { exit 1 }
          if ("${{ steps.coverage-check.outputs.status }}" -eq "❌ Failed") { exit 1 }
          if ("${{ steps.sonar-end.outcome }}" -eq "failure") { exit 1 }
          if ("${{ steps.new-issues.outputs.count }}" -gt 0) { exit 1 }
